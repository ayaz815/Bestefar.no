<!DOCTYPE html>
<html lang="en" data-os="" data-browser="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: "AgencyR";
        src: url("../fonts/AGENCYR.TTF") format("truetype");
      }
      .font-agency {
        font-family: "AgencyR", sans-serif;
      }

      /* ========================
         OS + Browser Overrides
         ======================== */

      /* iOS Safari only: make bars taller */
      :root[data-os="ios"][data-browser="safari"] .yellow-bar {
        height: 6rem !important; /* h-24 */
      }

      /* iOS Chrome only (optional): different height */
      :root[data-os="ios"][data-browser="chrome"] .yellow-bar {
        height: 4rem !important; /* h-16 for example */
      }
    </style>

    <script>
      // Detect OS & Browser and set data attributes on <html>
      (function () {
        const root = document.documentElement;
        const ua = navigator.userAgent || "";
        const plat = navigator.platform || "";

        // OS detection
        let os = "unknown";
        const isiOS =
          /iPhone|iPad|iPod/.test(ua) ||
          /iPhone|iPad|iPod/.test(plat) ||
          (/(Mac)/.test(plat) && "ontouchstart" in window);
        const isAndroid = /Android/.test(ua) || /Android/.test(plat);

        if (isiOS) os = "ios";
        else if (isAndroid) os = "android";
        else if (/Win/.test(plat)) os = "windows";
        else if (/Mac/.test(plat)) os = "mac";
        else if (/Linux/.test(plat)) os = "linux";

        // Browser detection
        let browser = "unknown";
        if (/Edg\//.test(ua)) browser = "edge";
        else if (/OPR\//.test(ua)) browser = "opera";
        else if (/CriOS|Chrome\//.test(ua))
          browser = "chrome"; // Chrome & Chrome on iOS (CriOS)
        else if (
          /Safari\//.test(ua) &&
          /Version\//.test(ua) &&
          !/Chrome|CriOS|Edg\//.test(ua)
        )
          browser = "safari";
        else if (/Firefox\//.test(ua)) browser = "firefox";

        root.setAttribute("data-os", os);
        root.setAttribute("data-browser", browser);
      })();
    </script>
  </head>

  <body class="h-screen bg-[#FFC000] flex justify-center">
    <div class="sm:w-full sm:block hidden"></div>
    <div
      class="relative w-full sm:w-[2000px] lg:w-[70%] h-screen shadow-2xl shadow-black bg-black flex flex-col justify-between"
      id="screen2FullScreen"
    >
      <div
        id="leftNavigation"
        class="absolute top-0 left-0 w-[10%] h-full z-20 cursor-pointer bg-transparent transition-all"
        onclick="navigateToScreen('./show.html?screen=16')"
      ></div>
      <div
        id="rightNavigation"
        class="absolute top-0 right-0 w-[10%] h-full z-20 cursor-pointer bg-transparent transition-all"
        onclick="navigateToScreen('./screen18.html')"
      ></div>

      <!-- TOP YELLOW BAR -->
      <div class="w-full bg-[#FFC000] h-7 yellow-bar"></div>

      <div class="flex flex-col justify-center items-center my-auto h-full">
        <div class="flex flex-col w-full justify-center items-center">
          <h1 class="font-agency text-4xl text-[#FFC000]">Ferdig!</h1>
          <h2 class="font-agency text-4xl text-[#FFC000]">Du har nå to valg</h2>
        </div>
        <a
          href="./show.html"
          class="flex flex-col justify-between items-center my-7 cursor-pointer"
        >
          <img src="../assets/logo.jpg" alt="" class="w-full px-[5%]" />
          <img
            src="../assets/pointer-up.png"
            alt=""
            class="w-[35%] rotate-12"
          />
          <h1 class="font-agency text-3xl text-[#FFC000]">
            Gå til første spørsmål
          </h1>
        </a>
        <a
          href="./screen18.html"
          class="flex flex-col w-full justify-center items-center cursor-pointer"
        >
          <h1 class="font-agency text-3xl text-[#FFC000]">Eller</h1>
          <h2 class="font-agency text-3xl text-[#FFC000]">
            se listen over alle
          </h2>
          <img
            src="../assets/pointer-up.png"
            alt=""
            class="w-[25%] rotate-12"
          />
        </a>
      </div>

      <!-- BOTTOM YELLOW BAR -->
      <div class="w-full bg-[#FFC000] h-7 yellow-bar"></div>
    </div>

    <div class="sm:w-full sm:block hidden"></div>

    <script src="../script.js" defer></script>
  </body>
</html>
