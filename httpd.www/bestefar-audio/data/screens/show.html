<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Music App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: "AgencyFB";
        src: url("../fonts/AGENCYB.TTF") format("truetype");
      }

      @font-face {
        font-family: "AGENCYR";
        src: url("../fonts/AGENCYR.TTF") format("truetype");
      }

      @font-face {
        font-family: "ArialBlack";
        src: url("../fonts/ariblk.ttf") format("truetype");
      }

      .font-agency {
        font-family: "AGENCYR", sans-serif;
      }

      .font-aptos {
        font-family: "Aptos", sans-serif;
      }

      .font-arial-black {
        font-family: "Arial Black", sans-serif;
      }

      .formatted-quill-content * {
        line-height: 1.2;
        white-space: normal;
        font: inherit;
        color: inherit;
      }

      .formatted-quill-content p {
        margin-bottom: 0.4rem;
      }

      .formatted-quill-content ul {
        padding-left: 1.5em;
        margin-bottom: 0.1rem;
        list-style-type: disc;
      }

      .formatted-quill-content ol {
        padding-left: 1.5em;
        margin-bottom: 0.1rem;
        list-style-type: decimal;
      }

      .formatted-quill-content li {
        margin-bottom: 0.1em;
      }

      .formatted-quill-content strong {
        font-weight: bold;
      }

      .formatted-quill-content em {
        font-style: italic;
      }

      .formatted-quill-content blockquote {
        border-left: 4px solid #ccc;
        padding-left: 1em;
        color: #555;
        font-style: italic;
        margin: 1em 0;
      }

      .formatted-quill-content a {
        color: #2563eb;
        text-decoration: underline;
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .formatted-quill-content h1,
      .formatted-quill-content h2,
      .formatted-quill-content h3,
      .formatted-quill-content h4,
      .formatted-quill-content h5,
      .formatted-quill-content h6 {
        font-weight: bold;
        margin-bottom: 0.4rem;
        line-height: 1.3;
        color: inherit;
      }

      .formatted-quill-content h1 {
        font-size: 1.875rem;
      }

      .formatted-quill-content h2 {
        font-size: 1.5rem;
      }

      .formatted-quill-content h3 {
        font-size: 1.25rem;
      }

      .formatted-quill-content h4 {
        font-size: 1.125rem;
      }

      .formatted-quill-content h5 {
        font-size: 1rem;
      }

      .formatted-quill-content h6 {
        font-size: 0.875rem;
      }
    </style>
  </head>

  <body
    class="h-screen bg-[#FFC000] flex justify-center overflow-hidden"
    id="screen1"
  >
    <div class="sm:w-full sm:block hidden"></div>

    <!-- Main Container -->
    <div
      class="fullscreen-target w-full sm:w-[1900px] lg:w-[70%] h-screen bg-[#FFC000] shadow-2xl shadow-black flex flex-col main-container opacity-0 transition-opacity duration-500"
      id="screen2FullScreen"
    >
      <!-- Navigation -->
      <div
        id="leftNavigation"
        class="absolute top-0 left-0 w-[10%] h-full z-20 cursor-pointer bg-transparent transition-all"
      ></div>
      <div
        id="rightNavigation"
        class="absolute top-0 right-0 w-[10%] h-full z-20 cursor-pointer bg-transparent transition-all"
      ></div>

      <!-- Title Section -->
      <div class="relative py-[2%]">
        <h1
          class="sm:text-4xl text-4xl text-black text-center font-agency"
          id="music-type"
        >
          <span id="screen-number">1</span>.
          <span id="music-type-name">Melodi</span>
        </h1>
        <img
          src="../assets/pointer-down-fixed.png"
          alt=""
          class="absolute w-[20%] right-3 sm:top-3 top-3 transform-none"
        />
        <!-- Right Top Navigation (25%) -->
        <div
          id="rightTopNav"
          class="absolute top-0 right-0 w-[25%] h-[50px] cursor-pointer bg-transparent"
        ></div>
      </div>

      <!-- Music Section -->
      <div
        class="bg-black flex flex-col items-center justify-between music-section flex-grow"
      >
     <p
  id="play-instruction"
  class="sm:text-lg text-lg text-center font-bold text-[#FFC000] py-[5%] font-arial-black"
>
  Spill av melodien
</p>
        <button
          id="playBtn1"
          class="play-btn relative group bg-transparent hover:border-none border-none focus-visible:outline-none focus:outline-none transition-transform duration-300 hover:scale-105"
        >
          <img
            id="playImg1"
            src="../assets/play-red1.png"
            alt="Play Music"
            class="sm:w-[68px] w-20 py-[3%]"
          />
          <!-- Left Top Navigation (25%) -->
          <div
            id="leftTopNav"
            class="absolute top-0 left-0 w-[10%] h-[35px] cursor-pointer bg-transparent z-[50] pointer-events-auto"
          ></div>

          <!-- Right Top Navigation (25%) -->
          <div
            id="rightTopNav"
            class="absolute top-0 right-0 w-[10%] h-[35px] cursor-pointer bg-transparent z-[50] pointer-events-auto"
          ></div>
        </button>
        <input
          type="range"
          id="seekBar1"
          class="seek-bar w-[80%] h-[3px] my-4 bg-gray-300 accent-gray-500 rounded-lg cursor-pointer focus:outline-none"
        />
      </div>

      <!-- Question Section -->
      <div
        class="relative question-section py-[2%] flex items-center justify-center"
      >
        <h1
          class="sm:text-4xl text-5xl text-black text-center font-normal font-agency"
        >
          Spørsmålet
        </h1>
        <img
          src="../assets/pointer-down-fixed.png"
          alt=""
          class="absolute w-[20%] right-3 sm:top-1 top-3 transform-none"
        />
      </div>

      <!-- Mic Section -->
      <div
        class="bg-black flex flex-col items-center justify-between py-[6%] mic-section toggle-question-area cursor-pointer flex h-full"
      >
        <p
          id="question-text"
          class="w-full text-center text-[#FFC000] font-arial-normal overflow-y-auto px-[2%] sm:px-[8%] py-[1%] text-lg sm:text-md h-full"
          style="scrollbar-width: none; -ms-overflow-style: none"
        ></p>

        <style>
          #question-text::-webkit-scrollbar {
            display: none;
          }
        </style>

        <div class="flex justify-center">
          <button
            class="speaker-btn relative group mb-0.5 bg-transparent hover:border-none border-none focus-visible:outline-none focus:outline-none"
          >
            <img
              src="../assets/speaker.jpg"
              alt="Speaker"
              class="sm:w-16 w-20 mic-icon py-[0.5%]"
            />
          </button>
        </div>
      </div>

      <!-- Answer Section -->
      <div
        class="flex flex-col justify-between items-center answer-section toggle-answer-area cursor-pointer"
      >
        <div class="flex flex-col items-center">
          <p class="text-sm font-bold answer-text font-arial-black">
            Det korrekt svaret er
          </p>
          <p
            class="p-4 px-4 text-center answer-text opacity-0 pointer-events-none transition-all duration-300 font-arial-black-normal"
            id="answer-text"
          >
            Loading...
          </p>
        </div>
      </div>

      <!-- Button to Show Facts -->
      <div class="flex justify-center sm:mb-[0%] mb-[24%]"">
        <button
          class=""
          id="fact-info-button cursor-pointer"
          onclick="showFactInfo()"
        >
          <img src="../assets/vite.jpg" alt="" class="w-40 mb-6" />
        </button>
      </div>

      <!-- Fact Info Drawer -->
      <div class="relative">
        <div class="sm:w-full sm:block hidden"></div>

        <div
          id="factDrawer"
          class="mb-[2%] sm:mb-[4%] absolute -bottom-[100px] h-[99vh] sm:h-[97vh] left-1/2 transform -translate-x-1/2 z-50 w-full translate-y-full transition-transform duration-300 hidden"
        >
          <!-- Close Button -->
          <div
            class="bg-transparent w-full flex justify-center pt-[5%] sm:pt-[3%]"
          >
            <button
              id="closeFactDrawer"
              class="px-8 py-4 text-2xl bg-blue-500 text-white hover:bg-red-600 transition w-20 h-15"
            >
              &#x2193;
            </button>
          </div>

          <!-- Scrollable Content with Hidden Scrollbar -->
          <div
            class="h-[calc(100%-11rem)] py-2 bg-[#FFC000] px-6 overflow-y-auto scrollbar-hide"
          >
            <div
              id="factDrawerContent"
              class="text-black formatted-quill-content"
            >
              Loading facts...
            </div>
          </div>
        </div>

        <div class="sm:w-full sm:block hidden"></div>
      </div>
    </div>

    <div class="sm:w-full sm:block hidden"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../script.js" defer></script>
    <script>
      // Dynamic screen detection from URL
      function getScreenNumber() {
        const urlParams = new URLSearchParams(window.location.search);
        const screen = urlParams.get("screen");
        if (screen) return parseInt(screen);

        // Fallback: try to extract from filename
        const path = window.location.pathname;
        const match = path.match(/screen(\d+)\.html/);
        return match ? parseInt(match[1]) : 1;
      }

      // Set the screen number and body ID dynamically
      const screenNum = getScreenNumber();
      document.body.id = `screen${screenNum}`;
      document.getElementById("screen-number").textContent = screenNum;

      // Update navigation links based on screen number
      function updateNavigation() {
        const leftNav = document.getElementById("leftNavigation");
        const rightNav = document.getElementById("rightNavigation");

        // Special handling for screen 1
        if (screenNum === 1) {
          // Previous: go to screen.html
          const prevTarget = window.location.pathname.includes("/data/screens/")
            ? "./screen.html"
            : "./data/screens/screen.html";

          // Next: go to show.html?screen=2
          const nextTarget = window.location.pathname.includes("/data/screens/")
            ? "./show.html?screen=2"
            : "./data/screens/show.html?screen=2";

          if (leftNav) leftNav.onclick = () => navigateToScreen(prevTarget);
          if (rightNav) rightNav.onclick = () => navigateToScreen(nextTarget);
        } else {
          // For screens 2-16
          const prevScreen = screenNum > 1 ? screenNum - 1 : 16;

          let nextTarget;
          if (screenNum === 16) {
            // Screen 16 goes to screen 17
            nextTarget = window.location.pathname.includes("/data/screens/")
              ? "./screen17.html"
              : "./data/screens/screen17.html";
          } else if (screenNum < 16) {
            // Screens 2-15 go to next screen
            const nextScreen = screenNum + 1;
            nextTarget = window.location.pathname.includes("/data/screens/")
              ? `./show.html?screen=${nextScreen}`
              : `./data/screens/show.html?screen=${nextScreen}`;
          } else {
            // Screen 17+ (fallback)
            nextTarget = window.location.pathname.includes("/data/screens/")
              ? "./show.html?screen=1"
              : "./data/screens/show.html?screen=1";
          }

          const prevTarget = window.location.pathname.includes("/data/screens/")
            ? `./show.html?screen=${prevScreen}`
            : `./data/screens/show.html?screen=${prevScreen}`;

          if (leftNav) leftNav.onclick = () => navigateToScreen(prevTarget);
          if (rightNav) rightNav.onclick = () => navigateToScreen(nextTarget);
        }
      }

      // Initialize navigation
      updateNavigation();

      function showFactInfo() {
        let factDrawer = document.getElementById("factDrawer");
        factDrawer.classList.remove("hidden");
        setTimeout(() => factDrawer.classList.remove("translate-y-full"), 10);
      }

      document
        .getElementById("closeFactDrawer")
        .addEventListener("click", function () {
          let factDrawer = document.getElementById("factDrawer");
          factDrawer.classList.add("translate-y-full");
          setTimeout(() => factDrawer.classList.add("hidden"), 300);
        });

      function navigateToScreen(url) {
        window.location.href = url;
      }
    </script>
    <style>
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </body>
</html>
